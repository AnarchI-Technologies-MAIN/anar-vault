[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "anar-vault"
version = "0.1.0"
description = "Encrypted storage and secret-handling infrastructure for AnarchI."
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=9.0"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"